version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch routine bumps into one PR instead of one-per-package noise;
      # anything MinVer/SourceLink/test-SDK related still gets its own
      # review since those directly affect the versioning/CI pipeline
      # this repo just built, not just app code.
      test-and-build-tooling:
        patterns:
          - "coverlet.*"
          - "Microsoft.NET.Test.Sdk"
          - "xunit*"
    labels:
      - "dependencies"
      - "nuget"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
