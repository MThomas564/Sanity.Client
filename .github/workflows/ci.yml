name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (a new push to a PR, or a rapid
# double-push to main) instead of letting them race to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; only the publish job (gated to push-on-main,
# below) elevates to packages: write. Fork PRs never see repo secrets
# or write-scoped tokens regardless, but least-privilege by default
# costs nothing and limits blast radius if a step is ever compromised.
permissions:
  contents: read

jobs:
  build-test:
    name: build & test (${{ matrix.os }}, ${{ matrix.tfm }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        tfm: [net8.0, net9.0, net10.0]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer derives Version from git tags and needs the full
          # history to find them -- a shallow clone (the default) makes
          # it silently fall back to a 0.0.0-prefixed version instead of
          # failing loudly.
          fetch-depth: 0

      - name: Setup .NET (8, 9, 10)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Sanity.Client.slnx

      - name: Build (whole solution, Release)
        # Builds src/, tests/, samples/ and the opt-in integration test
        # project together -- a breaking API change in the sample or a
        # compile error in any project fails CI here, not after merge.
        # TreatWarningsAsErrors is turned on for CI builds via
        # Directory.Build.props (keyed off the GITHUB_ACTIONS env var).
        run: dotnet build Sanity.Client.slnx -c Release --no-restore

      - name: Test (${{ matrix.tfm }})
        run: >
          dotnet test tests/Sanity.Client.Tests/Sanity.Client.Tests.csproj
          -c Release --no-build --framework ${{ matrix.tfm }}
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload coverage (ubuntu/net10.0 leg only)
        if: matrix.os == 'ubuntu-latest' && matrix.tfm == 'net10.0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: ./coverage
          retention-days: 14

  format:
    name: dotnet format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet format Sanity.Client.slnx --verify-no-changes

  vulnerable-dependencies:
    name: vulnerable dependency gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Sanity.Client.slnx
      - name: Check for known-vulnerable packages (direct + transitive)
        run: |
          set -o pipefail
          output=$(dotnet list Sanity.Client.slnx package --vulnerable --include-transitive)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet package(s) detected -- see output above."
            exit 1
          fi

  package-smoke-test:
    name: package smoke test (pack -> install -> publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Pack both packages
        run: |
          mkdir -p ./smoke/nupkgs
          dotnet pack src/Sanity.Client/Sanity.Client.csproj -c Release -o ./smoke/nupkgs
          dotnet pack src/Sanity.Client.Presentation/Sanity.Client.Presentation.csproj -c Release -o ./smoke/nupkgs

      - name: Install the packed nupkgs into a throwaway Blazor WASM app
        # This matters most for Sanity.Client.Presentation: its vendored
        # JS ships as Razor-class-library static web assets
        # (_content/Sanity.Client.Presentation/...), which only get
        # composed correctly through a real PackageReference consumption
        # -- the repo's own tests/sample use ProjectReference, which
        # would NOT catch a packaging regression here.
        run: |
          version=$(basename ./smoke/nupkgs/Sanity.Client.Presentation.*.nupkg .nupkg | sed 's/^Sanity\.Client\.Presentation\.//')
          echo "Packed version: $version"

          mkdir -p ./smoke/app
          cd ./smoke/app
          dotnet new blazorwasm -o . -n SmokeApp --force

          cat > nuget.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local-smoke" value="../nupkgs" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF

          dotnet add package Sanity.Client.Presentation --version "$version"
          dotnet publish -c Release -o ./publish-out

      - name: Verify vendored JS static web assets are present
        run: |
          asset_dir="./smoke/app/publish-out/wwwroot/_content/Sanity.Client.Presentation"
          test -f "$asset_dir/sanity-presentation-interop.js" || { echo "::error::Missing sanity-presentation-interop.js in published static web assets"; exit 1; }
          test -f "$asset_dir/vendor/stega/sanity-stega.min.mjs" || { echo "::error::Missing vendored @vercel/stega bundle in published static web assets"; exit 1; }
          echo "Static web assets present:"
          find "$asset_dir" -type f -not -name "*.br" -not -name "*.gz"

  publish-github-packages:
    name: publish prerelease to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-test, format, vulnerable-dependencies, package-smoke-test]
    # Only ever runs for a push that landed on main -- never for PRs
    # (including same-repo PRs, let alone fork PRs, which get no
    # secrets/write token regardless). This is every main-branch build,
    # not just tagged releases: see RELEASING.md for why nuget.org is
    # reserved for tags instead.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: |
          mkdir -p ./nupkgs
          dotnet pack src/Sanity.Client/Sanity.Client.csproj -c Release -o ./nupkgs
          dotnet pack src/Sanity.Client.Presentation/Sanity.Client.Presentation.csproj -c Release -o ./nupkgs

      - name: Push to GitHub Packages
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text
          dotnet nuget push "./nupkgs/*.nupkg" --source github --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
